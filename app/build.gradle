plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cctv.fullscreen'
    compileSdk 34

    defaultConfig {
        applicationId "com.cctv.fullscreen"
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName "1.0"
    }

    // 两个变体：gecko = 内置内核，webview = 用系统内核
    flavorDimensions "engine"
    productFlavors {
        webview {
            dimension "engine"
            // 不带内核：用系统 WebView，并在启动时检查内核版本
            resValue "string", "app_name", "CCTV 直播"
            buildConfigField "boolean", "WEBVIEW_CHECK", "true"
        }
        gecko {
            dimension "engine"
            applicationIdSuffix ".gecko"
            versionNameSuffix "-gecko"
            // 带内核：内置 GeckoView，不再依赖系统内核版本
            resValue "string", "app_name", "CCTV 直播 (内置内核)"
            buildConfigField "boolean", "WEBVIEW_CHECK", "false"
            ndk {
                // 电视盒子足够，避免把 4 个 ABI 全打进包
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    packaging {
        jniLibs {
            // GeckoView 的 .so 需要解压安装
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.9.0'
    // WebViewCompat.addDocumentStartJavaScript：向**所有框架**（含跨域 iframe）
    // 注入脚本，这是"官网播放器在 iframe 里导致不进全屏"的根治手段。
    implementation 'androidx.webkit:webkit:1.8.0'
    // 仅 gecko 变体：内置浏览器内核
    geckoImplementation 'org.mozilla.geckoview:geckoview:128.0.20240725162350'
}
