plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cctv.fullscreen'
    compileSdk 34

    defaultConfig {
        applicationId "com.cctv.fullscreen"
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName "1.0"
    }

    // 两个变体：guard = 带内核版本检测，plain = 不带
    flavorDimensions "webviewCheck"
    productFlavors {
        guard {
            dimension "webviewCheck"
            applicationIdSuffix ".guard"
            versionNameSuffix "-guard"
            resValue "string", "app_name", "CCTV 直播 (内核检测)"
            buildConfigField "boolean", "WEBVIEW_CHECK", "true"
        }
        plain {
            dimension "webviewCheck"
            resValue "string", "app_name", "CCTV 直播"
            buildConfigField "boolean", "WEBVIEW_CHECK", "false"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.9.0'
    // WebViewCompat.addDocumentStartJavaScript：向**所有框架**（含跨域 iframe）
    // 注入脚本，这是"官网播放器在 iframe 里导致不进全屏"的根治手段。
    implementation 'androidx.webkit:webkit:1.8.0'
}
